# JitPack builds a tag with this and serves com.github.vinaooo.vinkit:<module>:<tag>.
# Its image already has the Android SDK; AGP downloads a missing platform itself.
# Its openjdk21 is 21.0.2, which can't read the Gradle 9.8 wrapper jar (entries dated 1970): Temurin instead. Each
# line runs in its own shell, so the JDK switch and the build share one.
before_install:
  - sdk install java 21.0.12+1.1-tem < /dev/null
install:
  - sdk use java 21.0.12+1.1-tem && java -version && ./gradlew publishToMavenLocal --no-configuration-cache
