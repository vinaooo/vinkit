# JitPack builds a tag with this and serves com.github.vinaooo.vinkit:<module>:<tag>.
# Its image already has the Android SDK; AGP downloads a missing platform itself.
jdk:
  - openjdk21
install:
  # ponytail: JitPack sometimes can't open gradle-wrapper.jar on a fresh checkout (0.0.1, 0.2.0); one retry after a
  # pause has always been enough. If it keeps failing, regenerate the wrapper in before_install instead.
  - ./gradlew publishToMavenLocal --no-configuration-cache || (sleep 15 && ./gradlew publishToMavenLocal --no-configuration-cache)
